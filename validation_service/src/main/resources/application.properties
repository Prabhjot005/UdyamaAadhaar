server.port=8010
spring.application.name=validation_service
spring.kafka.bootstrap-servers=kafka-broker:29092
spring.kafka.consumer.group-id=validation_service_reprocess_group_test24
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=500
spring.kafka.consumer.enable-auto-commit=true
# Error handling - continue on deserialization failure
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Log failed deserializations instead of crashing
spring.kafka.listener.ack-mode=manual_immediate

app.kafka.topic=unvalidated_raw_data_test
app.kafka.topic.departmentRecords=unvalidated_raw_data
app.kafka.topic.events=unvalidated_events
app.kafka.topic.validDepartmentRecords=valid_department_records
app.kafka.topic.validEvents=valid_events

# MongoDB Configuration
spring.mongodb.host=mongodb
spring.mongodb.port=27017
spring.mongodb.database=udyama
spring.mongodb.username=admin
spring.mongodb.password=admin
spring.mongodb.authentication-database=admin
